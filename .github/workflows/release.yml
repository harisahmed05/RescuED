name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build runnable JAR
        run: mvn -B package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rescued-simulation-jar
          path: target/rescued-simulation-*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: rescued-simulation-jar
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: 'true'
          files: |
            artifacts/*.jar
            README.md
            LICENSE
            docs/ARCHITECTURE.md
            docs/GAMEPLAY.md
            docs/screenshot.png
          body: |
            ## RescuED ${{ github.ref_name }}

            Beta release of RescuED — a real-time disaster-relief logistics simulation built in Java Swing.

            **Run the JAR:**
            ```bash
            java -jar rescued-simulation-${{ github.ref_name }}.jar
            ```

            See the [README](../../blob/${{ github.ref_name }}/README.md) for full gameplay, controls, and configuration.
